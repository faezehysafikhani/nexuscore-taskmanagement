name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "41 3 * * 1"   # weekly: new advisories appear without any change of ours

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore NexusCore.sln
      # NuGetAudit (Directory.Build.props) turns a high or critical advisory into a build error.
      - run: dotnet build NexusCore.sln --no-restore -c Release
      - run: dotnet test NexusCore.sln --no-build -c Release
      # The full list, transitive packages included, for the log.
      - run: dotnet list NexusCore.sln package --vulnerable --include-transitive
